      src/web/server.ts:170  await saveReviewArtifact(reviewArtifact, reviewsDir);
      src/v1-e2e.test.ts:69-86  real fetch POST x2 -> loadReviewArtifact x2 -> steps deep-equal + verdict approved
      Suite: npx vitest run reviewArtifact+server+v1-e2e = 22 passed.
