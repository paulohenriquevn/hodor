    file: src/core/index.ts
    line: 51
    plan_ref: T1.3 reviewArtifact (save/loadReviewArtifact em reviews/)
    summary: >
      loadReviewArtifact has NO production caller — only test callers (v1-e2e.test.ts,
      server.test.ts, reviewArtifact.test.ts). It is the read-side of the persistence
      boundary and is exercised as the OBSERVABLE in the E2E (pillar c), so it is NOT
      dead code — it is export-for-test. The production read path (run-vs-run
      comparison consuming the artifact) is explicitly scoped to M5 per the plan.
    evidence: |
      grep -rln "loadReviewArtifact" src/ | grep -v test  ->  only src/core/index.ts (re-export) + reviewArtifact.ts (definition)
      All actual call sites are test files:
        src/v1-e2e.test.ts:80,81   (E2E observable: loads both artifacts, asserts steps deep-equal)
        src/web/server.test.ts:215,229
        src/core/reviewArtifact.test.ts:63,73
      Plan T1.3 mandated save/load round-trip; M5 is the future production reader.
    recommended_action: >
      ACCEPT for M3. This is honest export-for-test of a symmetric persistence API
      (save has a production caller; load is its inverse, consumed by the E2E proof
      and the future M5 reader). No action needed; note it in the review so the M5
      cycle wires the production read path. Do NOT add a no-op caller to satisfy a
      checkbox.

  - id: F-wire-2
    severity: LOW
    file: src/core/reviewArtifact.ts
    line: 17
    plan_ref: T1.2 normalizeRun / T1.3 reviewArtifact (steps normalizados)
    summary: >
      reviewArtifact.ts defines its own zod NormalizedStepSchema (line 17) instead of
      deriving from / reusing the exported NormalizedStep type in normalizeRun.ts. The
      two shapes are kept in sync by hand. NormalizedStep (the type) is therefore not
      consumed by reviewArtifact — it is effectively export-for-test/future-use. This
      is a mild DRY smell (two representations of one concept), not a wiring break.
    evidence: |
      src/core/normalizeRun.ts:23  export interface NormalizedStep { request; response{status,statusText,headers,body}; asserts?; captures? }
      src/core/reviewArtifact.ts:17 const NormalizedStepSchema = z.object({ request, response{status,statusText,headers,body}, asserts?, captures? })
      grep shows NormalizedStep type has no consumer outside normalizeRun.ts itself.
      buildReviewArtifact (line 47) consumes normalizeRun(env).steps at runtime, so the
      DATA is wired; only the TYPE/SCHEMA duplication is the concern.
    recommended_action: >
      ACCEPT for M3 (the duplication is ~6 lines and both are validated). Consider, in a
      later cleanup, deriving NormalizedStep from NormalizedStepSchema via z.infer (single
      source of truth) so the shapes cannot drift. Non-blocking.

