  - id: F-arch-5
    severity: MEDIUM
    file: .gitignore
    line: 27
    plan_ref: "ADR D1 (separação run bruto vs artefato); Q2 (last-write-wins)"
    summary: >-
      Verdict duplicado em DOIS locais committáveis (verdicts/{id}.json e o verdict
      embutido em reviews/{id}.json); o comentário do .gitignore chama verdicts/ de
      "store ao-vivo" mas verdicts/ NÃO está gitignored — ambiguidade de fonte-de-verdade.
    evidence: |
      `git check-ignore verdicts/ reviews/` → exit 1 (NENHUM dos dois é ignorado).
      .gitignore L27-29:
        # NOTA (M3): `reviews/` ... é COMMITÁVEL ...
        # `verdicts/` é o store ao-vivo da web app (M2); o canônico versionado é `reviews/`.
      O comentário afirma que reviews/ é "o canônico versionado" e implica que
      verdicts/ é efêmero/live — mas verdicts/ é committável tanto quanto reviews/
      (não está no .gitignore). Resultado: o mesmo verdict (approved/rejected/note/
      decidedAt) é persistido em verdicts/{id}.json (M2, JSON.stringify não-estável)
      E embutido em reviews/{id}.json (M3, stableStringify). Se ambos forem
      commitados, há duas representações da MESMA decisão, com a possibilidade de
      divergirem (verdicts/ não é byte-determinístico; decidedAt difere a cada POST
      por causa de `new Date().toISOString()` no postVerdict — last-write-wins).
      Isto é uma duplicação de CONHECIMENTO (a decisão humana), não só de código —
      tensão com DRY (CLAUDE.md §12) e com a heurística de fonte única autoritativa.
    recommended_action: >-
      Decidir e documentar explicitamente a intenção: (a) se reviews/ é canônico e
      verdicts/ é live-only, então gitignore `verdicts/` (como runs/) para que NÃO
      seja commitado — eliminando a duplicação no git; OU (b) se ambos são
      intencionalmente versionados, registrar um ADR justificando as duas
      representações e qual vence em caso de divergência. Hoje o comentário diz uma
      coisa (verdicts/ é live) e o .gitignore faz outra (verdicts/ é committável).
      Escopo é pequeno — uma linha no .gitignore ou um ADR de 5 linhas.

