  - id: F-arch-6
    severity: LOW
    file: src/web/server.ts
    line: 169
    plan_ref: "EC-1; Failure scenarios (plan L522-530)"
    summary: >-
      saveVerdict e saveReviewArtifact não são atômicos entre si — falha de I/O na
      2ª escrita deixa verdict gravado sem o artefato correspondente.
    evidence: |
      ```ts
      await saveVerdict(verdict, verdictsDir);        // escrita 1
      await saveReviewArtifact(reviewArtifact, reviewsDir);  // escrita 2
      ```
      Se saveReviewArtifact falhar (ex.: disco cheio, EACCES em reviewsDir após
      verdictsDir ter sucedido), o verdict fica persistido mas o artefato
      versionável não — estado parcialmente-escrito. Propaga → 500 (Rule 8, não
      engole — correto), e ambas são last-write-wins (retry idempotente — mitiga).
      O plano (L405-408) reconhece "ambas as escritas são last-write-wins
      (idempotente no retry)" mas não trata a janela entre as duas.
    recommended_action: >-
      Aceitável para o modelo local single-user de M3 (retry corrige), mas
      documentar como risco conhecido em Drawbacks & Risks (já há tabela; falta
      esta linha). Para M5+ considerar inverter a ordem (artefato canônico primeiro)
      ou um write-then-rename. Não bloqueia.

