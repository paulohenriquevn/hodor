v1_closure_assessment: |
  CRITÉRIO V1 (M0-M3 [x]): GENUINAMENTE ATENDIDO. O loop E2E inteiro
  (agente->execução->revisão->verdict) está em arquivos commitáveis REAIS — não stub:
  - persistRun grava run real; POST /verdict via HTTP real; saveReviewArtifact grava
    reviews/{id}.json determinístico/normalizado.
  - O artefato versionável existe rastreado no git (git ls-files reviews/) e passa
    git check-ignore vazio (commitável).
  - normalização provada estável (2 runs voláteis-diferentes -> steps deep-equal).
  RESSALVA (não bloqueia o critério, mas HIGH de higiene): o ÚNICO artefato committado
  no repo (reviews/...-aa.json) foi gerado por LEAK do teste M2 review-e2e.test.ts
  (que não isola reviewsDir e cai no default "reviews/"), e foi git add-ado no commit
  T3.1 — não é uma fixture deliberada. O teste V1 (correto) usa tmpdir. Isso re-suja a
  árvore a cada `npm test`, violando a pré-condição RELEASE "no uncommitted changes".

findings:
  - id: F-xval-1
    severity: HIGH
    file: src/review-e2e.test.ts
    line: 27
    plan_ref: "T2.1 Deep Dives + Global DoD 'Compatibilidade M0/M1/M2'; ROADMAP §M3 DoD#1 (diff-amigável)"
    summary: >-
      Teste M2 review-e2e.test.ts chama buildWebServer(runsDir, verdictsDir) SEM reviewsDir;
      após a mudança T2.1, o POST /verdict passa a escrever no diretório reviews/ REAL do
      repo (default defaultReviewsDir() = "reviews"), com runId 00000000-...-aa. O resultado
      foi git add-ado no commit T3.1 (d0aaf00) — o único artefato versionado em reviews/ é,
      na verdade, lixo de teste, não uma fixture. Cada `npm test` reescreve decidedAt e suja
      a árvore (git status mostra ' M reviews/00000000-...-aa.json'), violando a pré-condição
      de RELEASE 'no uncommitted changes' e poluindo justamente o diretório que o M3 existe
      para manter diff-limpo.
    evidence: |
      src/review-e2e.test.ts:27  server = buildWebServer(runsDir!, verdictsDir!);  // sem reviewsDir
      src/review-e2e.test.ts:36  const RUN_ID = "00000000-0000-0000-0000-0000000000aa";
      src/web/server.ts:55       reviewsDir: string = defaultReviewsDir(),  // = "reviews"
      git log --follow reviews/00000000-...-aa.json  -> só d0aaf00 (commit T3.1 e2e), não um fixture deliberado
      git diff (pós npm test): decidedAt 2026-06-19T07:39:46 -> 07:42:39  (mutação a cada run)
      O teste V1 correto (v1-e2e.test.ts) usa mkdtemp p/ reviewsDir e runIds a1/b2 — prova que o leak é só do teste M2.
    recommended_action: >-
      (a) Em src/review-e2e.test.ts isolar reviewsDir: criar mkdtemp e passar como 3º arg em
      buildWebServer(runsDir!, verdictsDir!, reviewsDir!), com cleanup no afterEach (espelhar
      v1-e2e.test.ts). (b) git rm --cached reviews/00000000-...-aa.json (não é fixture; é leak)
      e remover o arquivo, OU — se a intenção for ter uma fixture committada demonstrando o
      formato — renomeá-la para um id estável e gerá-la deterministicamente com decidedAt fixo
      (sem new Date()) para não re-sujar. Re-rodar `npm test` e confirmar `git status` limpo.

  - id: F-xval-2
    severity: LOW
    file: CHANGELOG.md
    line: 5
    plan_ref: "Unbreakable Rule 6 (toda entry com referência #ticket/#PR)"
    summary: >-
      A entry M3 em [Unreleased] § Added não carrega referência (#issue/#PR) exigida pela
      Unbreakable Rule 6. Consistente com o histórico do repo (M2 idem), portanto LOW —
      mas o gate FAANG deve registrar.
    evidence: |
      CHANGELOG.md:5  "- **M3 — Persistência versionável...** ZERO dependência nova."  (sem "(#...)")
    recommended_action: >-
      Adicionar referência ao PR/milestone, ex. "(M3)" ou "(#<pr>)". Decisão de processo —
      pode ser dispensado por padrão pré-existente do repo, mas anote para uniformizar.

