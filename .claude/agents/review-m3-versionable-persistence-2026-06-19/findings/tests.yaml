  - id: F-tests-7
    severity: LOW
    file: src/core/reviewArtifact.test.ts
    line: 66
    plan_ref: 'TDD T1.3 — review_artifact_rejects_wrong_version'
    summary: >
      TDD order: tests e implementação foram co-commitados em 1582c47 (feat(core)),
      não em commits RED separados antes do GREEN. Não é possível provar via git history
      que o teste falhou antes da impl existir. Co-commit é aceitável (o plano lista os
