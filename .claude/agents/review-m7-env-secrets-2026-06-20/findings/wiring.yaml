findings:
  - id: WIRE-1
    severity: HIGH
    title: Secret-bearing URL leaks unredacted via RequestExecutionError on the request-failure path (forgotten sink)
    location: src/core/executeRequest.ts:54
    evidence: |
      executeRequest builds the thrown error message embedding the FULL interpolated URL:
        const reason = controller.signal.aborted ? `timeout: ${url}` : `request failed: ${url}`;
        throw new RequestExecutionError(reason, { cause });
      When a scenario injects a secret into the URL/query (e.g. `?q=${{ env.QKEY }}`),
      interpolateRequest (interpolate.ts:41) substitutes encodeURIComponent(secret) into
      `url`. On a network failure / timeout (target down, wrong port, connection reset),
      `url` — carrying the encoded secret — is placed verbatim into the exception message.

      redactSecretValues runs ONLY on the success path (server.ts:125 / checkScenario.ts:46),
      AFTER runScenario returns an envelope. The throw path has NO redaction hook:
        - run_scenario (server.ts:122): `await runScenario(...)` has NO try/catch — the
          RequestExecutionError propagates out of the tool handler to the MCP agent
          (isError:true with the raw message) and to stderr/unhandled-rejection.
        - check_scenario (server.ts:181): same propagation via checkScenario → runScenario.
      This is the exact failure mode M7's threat model exists to prevent (secret never
      leaves the process boundary), and it is wide open on the error path.
    why_dangerous: |
      Realistic and common: an authenticated scenario whose target is down/slow is the
      normal regression-gate situation. The error message returns to the MCP agent
      (the LLM client) and is logged — exactly the surfaces M7 promises never see a secret.
      Header-borne secrets (Authorization) are NOT in the message (only ${url}); URL/query
      and body-interpolated secrets are. The M7 design already encodes secrets into the URL
      (interpolate.ts:41), so query-param API keys are a first-class, intended use case.
    coverage_gap: |
      m7-e2e.test.ts covers ONLY: (a) success path 200 → persisted run redacted (l.52-93),
      and (b) missing-secret → ScenarioError BEFORE any request (l.95-105). There is NO test
      for a request that REACHES the network and FAILS while carrying a secret in the URL.
      The leak is therefore both unwired and untested.
    suggested_fix: |
      Redact secret values from RequestExecutionError messages before they cross the
      tool/agent/stderr boundary. Options: (1) wrap runScenario in run_scenario/check_scenario
      with a catch that scrubs Object.values(secrets) (raw + encodeURIComponent) from
      err.message before rethrowing; OR (2) stop embedding the raw URL in the message
      (executeRequest.ts:54) — e.g. include only host+path or a redacted url, keeping the
      raw URL solely in the structured run (which IS redacted). Add an e2e regression test:
      secret in URL + unreachable target → assert error surfaced to agent/stderr contains
      neither the raw nor the encodeURIComponent form of the secret.

  - id: WIRE-2
    severity: LOW
    title: replaySuite.SuiteItemResult.error can hold an unredacted secret (latent, not currently exposed)
    location: src/core/replaySuite.ts:65
    evidence: |
      `error = err instanceof Error ? err.message : String(err)` captures the same
      RequestExecutionError message (WIRE-1) into SuiteReport.results[].error. Today the
      replay_suite tool (server.ts:213) builds `out` WITHOUT results[], so this string does
      NOT reach the MCP response nor the stderr event. It is contained for now.
    why_low: Not currently a live sink — no production path emits results[]. Flagged because
      it is one refactor away from becoming a leak (e.g. if results[] is later surfaced in the
      tool output or the web app), and it shares the same root cause as WIRE-1.
    suggested_fix: Fixing WIRE-1 at the source (scrub in executeRequest message or at the
      runScenario boundary) closes this transitively. No separate action required if WIRE-1
      is fixed at the source rather than only in the two tool handlers.

