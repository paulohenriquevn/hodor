concurrent_safety:
  status: PASS_WITH_NOTE
  notes: |
    pruneRunHistory does read-then-rm on runs/ (read-modify-delete) and the diff route does
    read-then-read. Concurrent prune + diff on the same scenario could rm a run that
    findPreviousRun just selected → diffRuns would never see it (the route reads curr first,
    then prev; rm of prev mid-flight yields a benign "first run" message, not a crash).
    rm uses { force: true } so a double-delete is a no-op. Plan declares last-write-wins
    accepted (T2.1 Concurrency note), consistent with M2/M3. No data corruption; acceptable
    for the local single-process MVP. Logged here for the record, not blocking.

findings:
  - id: F-wire-1
    severity: HIGH
    file: src/core/runHistory.ts
    line: 76
    plan_ref: T2.1 wiring triad pillar c "runs/ podado" + ADR D5 (risco #2 retenção)
    summary: >
      Retention (pruneRunHistory) has NO observable success signal in production. The MCP
      wrapper pruneAfterPersist (mcp/server.ts:20-26) logs only the FAILURE path
      ("prune_failed"); when prune succeeds and deletes N old runs, nothing is emitted to
      stderr. Pillar (c) for the retention feature is therefore not honestly satisfied in a
      real workload — ops cannot see retention working (or silently NOT deleting because a
      run is verdict-pinned). The implementation summary claims pillar (c) = "runs/ podado",
      but that is only observable in the test by reading the directory, never in production.
    evidence: |
      src/mcp/server.ts:20-26  pruneAfterPersist → only console.error on catch.
      src/core/runHistory.ts:76-89 pruneRunHistory returns void; no count, no log of how many
      runs were removed or pinned.
      Contrast: run_request/run_scenario DO emit structured stderr metrics (server.ts:78, 109).
      The retention metric (the one risk #2 of the ROADMAP is about) is the one left silent.
    recommended_action: >
      Have pruneRunHistory return the count of removed + pinned runs (or accept a logger), and
      have pruneAfterPersist emit a structured stderr line on the success path, e.g.
      {"event":"prune","scenarioKey":...,"removed":N,"pinned":M,"kept":K}. This makes the
      retention behavior auditable in production and closes pillar (c) honestly.

  - id: F-wire-2
    severity: LOW
    file: src/core/index.ts
    line: 59
    plan_ref: T2.1 — exports of runHistory
    summary: >
      defaultHistoryLimit is exported on the public API but has no external production caller —
      it is used only as a default-param value inside runHistory.ts. This is acceptable as an
      export-for-API affordance (callers can read the configured limit), but it is the only M5
      export with neither an external caller nor a public type consumer. Flagged for honesty,
      not blocking.
    evidence: |
      grep "defaultHistoryLimit" src/ excluding runHistory.ts + index.ts → empty.
    recommended_action: >
      Keep if you intend the limit to be programmatically queryable; otherwise consider not
      re-exporting it (it remains usable internally as the default param). No action required
      for this milestone.

