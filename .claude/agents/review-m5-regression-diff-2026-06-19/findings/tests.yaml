      por caminhos distintos passaria silenciosamente.
    evidence: |
      Linha 104 comenta "limit 0/negativo/NaN"; única chamada: pruneRunHistory("cenário-a", dir, 0, vdir)
    recommended_action: >
      Parametrizar com it.each([0, -3, NaN]) ou adicionar dois asserts
      explícitos, OU corrigir o comentário para "limit não-positivo (0)".

  - id: F-tests-4
