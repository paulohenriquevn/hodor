edge_cases_from_plan:
  covered: 18
  missing: []
  anti_flaky_check:
    same_scenario_only_noise_differs: true
    evidence: >
      e2e step 2: r2 e o run fresco usam o MESMO serverValue="stable-A";
      o servidor só incrementa $.timestamp (tick) entre requests → os dois
      bodies diferem SÓ no path de noise declarado ($.timestamp). diffRuns
      → bodyChanged:false, hasRegression:false. Anti-flaky genuíno, não
      teatro.
  real_change_check:
    changes_non_noise_field: true
    evidence: >
      e2e step 3: serverValue="changed-B" muda $.value (NÃO-noise); r3 ainda
      tem timestamp diferente. diffRuns(r2,r3) → bodyChanged:true. Prova que
      a detecção real sobrevive à supressão de noise (não é falso-negativo).

