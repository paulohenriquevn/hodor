  coverage core ≥90% nos três arquivos novos (maskNoise 100% linhas,
  diffRuns 96.15%, runHistory 93.54%). O E2E é honesto: prova anti-flaky
  REAL (runs do mesmo cenário diferindo só no $.timestamp declarado como
