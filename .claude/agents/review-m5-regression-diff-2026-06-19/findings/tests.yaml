    evidence: |
      render.test.ts:241 headerDiffs:[{ key:"x", prev:"<script>...", curr:"y" }]
    recommended_action: >
      Adicionar `curr: "<img src=x onerror=1>"` ao mesmo headerDiff e assert
      que não vaza — ou um segundo caso cobrindo curr.

