  - id: F-tests-3
    severity: LOW
    file: src/core/runHistory.test.ts
    line: 103
    plan_ref: "EC-2 — limit clamp 0/negativo/NaN"
    summary: >
      O comentário de prune_run_history_clamps_nonpositive_limit afirma cobrir
      "0/negativo/NaN" mas o assert exercita SÓ limit=0. Embora o ramo de clamp
