findings:
  - id: F-wire-1
    severity: MEDIUM
    file: src/core/draftStore.ts
    line: 79
    plan_ref: T1.3 draftStore (saveDraft/loadDraft/listDrafts) + Baseline Context "drafts/ commitável p/ humano editar"
    summary: >
      listDrafts has ZERO production caller and loadDraft has no production caller outside
      its own module (only listDrafts uses it internally). Both are reachable only from tests.
      M4 ships no GET /drafts route, no CLI, and no MCP tool that lists/reads drafts — so the
      "humano edita/refina no git antes de aprovar" loop (DoD #3) is served by raw file editing
      in drafts/, NOT by these read functions. They are export-for-test / planned-for-future-UI,
      not yet wired into any product surface.
    evidence: |
      grep -rn 'listDrafts' src/ | grep -v test  ⇒ only draftStore.ts (def) + index.ts (re-export)
      grep -rn 'loadDraft'  src/ | grep -v test  ⇒ only draftStore.ts:64 (def), :92 (internal use by listDrafts), index.ts (re-export)
      No `/drafts` HTTP route in src/web/server.ts (routes: `/`, `/runs/:id`, `/runs/:id/verdict`).
      No MCP tool reads/lists drafts (server.ts registers run_request, run_scenario, save_scenario_draft only).
      Precedent: M3 loadReviewArtifact (reviewArtifact.ts:91) has the IDENTICAL profile — defined in
      core, re-exported, only test/E2E callers, no web/server.ts caller — and was accepted at M3.
      So this is a consistent, pre-existing pattern in this codebase, not a regression.
    recommended_action: >
      NON-BLOCKING. Accept as honest export-for-test/future-UI (a drafts review UI is the natural
      M5+ consumer; code-quality classifies these as dead_public_export severity, but the M3
      precedent + the E2E/integration test coverage make them export-for-test, not dead). To be
      fully clean either (a) add a one-line note in core/index.ts that loadDraft/listDrafts are the
      read surface for a future drafts UI (planned, not dead), or (b) confirm via /code-quality that
      vulture/knip treats test-exercised public exports as live. Do NOT delete — they round-trip
      saveDraft and are exercised by mcp/draft.test.ts + draftStore.test.ts.

  - id: F-wire-2
    severity: INFO
    file: src/mcp/server.ts
    line: 119
    plan_ref: T2.1 DoD — métrica draftSavedCount em stderr (wiring pillar c)
    summary: >
      Pillar (c) for the draft tool is a process-local counter (draftSavedCount) + a stderr
      JSON event line. There is no persisted .wiring-evidence.json artifact in the repo, so the
      runtime-metric magnitude cannot be sanity-checked against a recorded real workload — only
      against test behavior. The counter increments correctly (before+1) through a REAL tool call.
    evidence: |
      find . -name .wiring-evidence.json (excl node_modules) ⇒ none.
      Metric is in-memory (server.ts:32 let draftSavedCount; :119 += 1; :33 getter) and stderr
      (server.ts:120 console.error event). Magnitude == 1 per save_scenario_draft call, which is
      the correct expected magnitude for a single-shot persistence tool (unlike a batch metric
      that should be >>0). draft.test.ts:81 asserts before+1 through the real InMemoryTransport call.
    recommended_action: >
      No action. The metric is honest and the magnitude is correct-by-design (1 per call). The
      absence of .wiring-evidence.json is consistent with the run_request/run_scenario tools
      (same in-memory-counter + stderr pattern, M0/M1) — this project's pillar-c convention is
      a counter + stderr event, not a persisted evidence file.

  - id: F-wire-3
    severity: INFO
    file: src/web/render.ts
    line: 250
    plan_ref: T3.1 — badge "na listagem E na view de run"
    summary: >
      The provenance badge is implemented twice by design: the run-view badge (provenanceBadge
      fn, render.ts:150, called at :219) and the listing badge (inline at render.ts:250-253 reading
      ListingItem.origin). This is NOT a DRY violation — different data shapes (full RunEnvelope vs
      flat ListingItem) and different copy. Both paths are production-reachable (GET /runs/:id and
      GET / respectively) and both are exercised by render.test.ts.
    evidence: |
      run-view: server.ts:107 renderRun → render.ts:219 provenanceBadge(env, verdict)
      listing:  server.ts:88 renderListing ← listRuns(:240 env.provenance?.origin) → render.ts:250 it.origin
    recommended_action: No action — both surfaces wired, XSS-escaped (escapeHtml on sourceKind/sourceRef), and tested.
