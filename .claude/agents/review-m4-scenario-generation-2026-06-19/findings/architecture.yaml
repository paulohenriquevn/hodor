  # ---------- DraftSchema cohesion ----------
  - id: F-arch-5
    severity: INFO
    file: src/core/draftStore.ts
    line: 18
    plan_ref: "T1.3; ADR D4; 'Avalie se DraftSchema = ScenarioSchema.extend({provenance}) é coeso'"
    summary: DraftSchema = ScenarioSchema.extend({ provenance }) is a coherent specialization — a Draft IS a Scenario whose provenance is mandatory, not a new parallel concept.
    evidence: |
      ```ts
      export const DraftSchema = ScenarioSchema.extend({ provenance: ProvenanceSchema });
      ```
      `.extend` tightens the optional `provenance?` (Scenario) to required (Draft) without
      restating any field — DRY. Semantically faithful to the glossary ("a draft is generated
      or authored, so origin always exists"). No LSP hazard: a Draft validates anywhere a
      Scenario is accepted (it is a stricter superset), so `run_scenario` / `runScenario`
      still accept it. Coupling Scenario→Draft is intrinsic and acceptable.
    recommended_action: None. Cohesive and the correct use of zod schema composition.

