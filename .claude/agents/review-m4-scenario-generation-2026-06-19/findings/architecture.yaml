  # ---------- MEDIUM: provenance not normalized but is content-bearing for diffs ----------
  - id: F-arch-8
    severity: MEDIUM
    file: src/core/reviewArtifact.ts
    line: 56
    plan_ref: "T1.2 (buildReviewArtifact carries env.provenance); M3 stableStringify diff invariant"
    summary: provenance.generatedAt is a wall-clock timestamp copied verbatim into the committable review artifact, which can make versionable diffs non-deterministic across re-runs of the same scenario.
    evidence: |
      ```ts
      ...(env.provenance !== undefined ? { provenance: env.provenance } : {}),
      ```
      M3's whole point (normalizeRun + stableStringify) is a stable, diffable committed artifact.
      `generatedAt` is free-form `z.string()` set by the agent/source; two reviews of the same
      logical draft will carry different `generatedAt`, perturbing the committed reviews/{id}.json
      diff. This is a softer cousin of the volatile-header normalization M3 already does for runs.
      It is not a correctness BLOCKER (the field genuinely describes draft origin), but it leaks a
      volatile value into the SoT artifact the human reviews in git.
    recommended_action: |
      Document the intent explicitly (provenance.generatedAt describes the DRAFT creation instant,
      not the run instant, so it is stable per draft) OR, if a draft can be re-run, confirm the run
      re-uses the draft's original generatedAt rather than re-stamping. A one-line ADR note or a test
      asserting "same draft → same generatedAt in artifact across two runs" would close the ambiguity.

  # ---------- MEDIUM: provenance.sourceRef unbounded length, persisted + rendered ----------
  - id: F-arch-9
    severity: MEDIUM
    file: src/core/provenance.ts
    line: 15
    plan_ref: "Risco #2 (sourceKind curl/traffic); render escapes sourceRef"
    summary: provenance.sourceRef is an unbounded z.string() (intended to hold a full curl/traffic example) persisted into committable drafts and reviews and rendered in HTML — no max length or shape constraint at the trust boundary.
    evidence: |
      ```ts
      sourceRef: z.string().optional(),
      ```
      The plan envisions sourceRef holding "curl ..." commands or traffic samples (risk #2).
      It is validated for XSS at render (escapeHtml in render.ts provenanceBadge — good) but has
      no `.max()` bound, so a multi-KB sourceRef bloats every committed artifact and the listing/run
      HTML. architecture.md §boundary: validate inputs at the boundary; size is part of validity.
    recommended_action: |
      Add a reasonable `.max(N)` (e.g. 4096) to ProvenanceSchema.sourceRef so the trust boundary
      bounds the persisted/rendered payload. Low-risk additive constraint; keep optional.

