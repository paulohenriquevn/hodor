# ── HONEST assessment of the deferred Tool-B curl parser ──
deferred_scope_assessment:
  question: "Tool aceita um cenário já-montado. DoD#1 '(ou curl)' é cumprido SEM o parser determinístico de curl?"
  verdict: "DEFENSIBLE — not a DoD gap, with one honest caveat (see F-xval-2)."
  reasoning: |
    1. ROADMAP DoD#1 reads: 'dado um endpoint (ou OpenAPI/curl de exemplo), O AGENTE gera um
       cenário candidato'. The generating actor is the AGENT, not the tool. The DoD never
       mandates a server-side deterministic curl→Scenario parser; it mandates that, given a
       curl example, a candidate scenario results. The agent (Claude, the MCP client) reads the
       curl, builds the Scenario, sets provenance.sourceKind='curl', and submits.
    2. plan ADR D1 + blueprint Rec 8 explicitly DEFER Tool B (scaffold_request_from_curl +
       shell-quote) under YAGNI/parsimony, with documented revisit trigger. This is a recorded
       decision, not silent omission — it appears in the ADR alternatives-rejected, the
       Drawbacks table (row 3), and CHANGELOG.
    3. provenance.sourceKind='curl' makes the origin auditable, so a reviewer sees the claim
       'this came from curl' and can verify the agent's parse against the recorded sourceRef.
  honest_caveat: |
    The tool does NOT VERIFY that the submitted Scenario actually corresponds to the cited
    sourceRef (e.g., a curl string). provenance is self-asserted by the agent. So 'from curl'
    is provable as PROVENANCE-LABELLED, not as MACHINE-PARSED-FROM-CURL. For M4's stated intent
    (human-in-the-gate review, agent-as-generator) this is acceptable and matches D1; but it is
    NOT the same as 'the system parses curl'. This is the correct line to call out — recorded
    as LOW F-xval-2 (advisory, ADR-backed defer; not a blocker).

