  # ---------------------------------------------------------------------------
  # HIGH — DRY / encapsulation: jsonpath extraction duplicated across 2 modules
  # ---------------------------------------------------------------------------
  - id: F-arch-1
    severity: HIGH
    file: src/core/evalAssert.ts
    line: 32
    plan_ref: ADR D2 + T1.4 "Deep file dependency analysis" ("reusa evalCapture (jsonpath) p/ source jsonpath:")
    summary: >-
      jsonpath-plus extraction logic is duplicated in evalAssert.ts (lines 32-41) and
      evalCapture.ts (lines 13-21) instead of evalAssert reusing evalCapture, violating
      the plan's stated encapsulation boundary and DRY of business logic.
    evidence: |
      The task boundary constraint states jsonpath-plus must live ONLY in evalCapture.ts.
      grep confirms it is imported in BOTH:
        src/core/evalAssert.ts:1:  import { JSONPath } from "jsonpath-plus";
        src/core/evalCapture.ts:1: import { JSONPath } from "jsonpath-plus";

      The identical "parse body → JSONPath → first match or null, swallow parse error"
      algorithm appears twice:

      evalCapture.ts:13-21
      ```ts
      if (spec.jsonpath !== undefined) {
        try {
          const json = JSON.parse(response.body) as ...;
          const matches = JSONPath({ path: spec.jsonpath, json, wrap: true }) as unknown[];
          value = matches.length > 0 ? matches[0] : null;
        } catch { return null; }
      }
      ```
      evalAssert.ts:32-41
      ```ts
      if (source.startsWith("jsonpath:")) {
        const path = source.slice("jsonpath:".length);
        try {
          const json = JSON.parse(response.body) as ...;
          const matches = JSONPath({ path, json, wrap: true }) as unknown[];
          return matches.length > 0 ? matches[0] : null;
        } catch { return null; }
      }
      ```
      Plan T1.4 "Deep file dependency analysis" explicitly says evalAssert "reusa
      evalCapture (jsonpath) p/ source jsonpath:". It does not. This is duplication
      of one knowledge (how Hodor evaluates a jsonpath against a response body) in
      two places — Unbreakable Rule 12 (DRY of business logic). If jsonpath
      semantics change (e.g. multi-match policy, wrap flag), two sites must change
      in lockstep — a classic divergence bomb.
    recommended_action: >-
      Extract a single internal helper (e.g. `evalJsonPath(path, body): unknown` in
      evalCapture.ts) and have evalAssert's `extractActual` call it for the
      `jsonpath:` source. After the change, `grep -rn "jsonpath-plus" src/` should
      resolve to evalCapture.ts only, matching ADR D2 + the task boundary contract.
  # ---------------------------------------------------------------------------
  # MEDIUM — duplicated request shape type instead of reusing schema-inferred type
  # ---------------------------------------------------------------------------
  - id: F-arch-2
    severity: MEDIUM
    file: src/core/interpolate.ts
    line: 20
    plan_ref: ADR D1 (ScenarioSchema is the single source of the format) + architecture.md §3 (minimize/own the contract)
    summary: >-
      interpolate.ts defines a local `InterpolatableRequest` interface that
      hand-redeclares the request shape already owned by ScenarioStepSchema.request,
      creating a second authoritative definition of the same domain shape.
    evidence: |
      src/core/interpolate.ts:20-25
      ```ts
      interface InterpolatableRequest {
        method: string;
        url: string;
        headers?: Record<string, string>;
        body?: string;
      }
      ```
      The exact same shape is already the zod-inferred type of
      `ScenarioStepSchema.request` (scenarioSchema.ts:41-46). ADR D1 declares the
      zod schema the "fonte única do formato". Two declarations of the same shape
      can silently diverge (e.g. when a `query?` or `timeout?` field is added to the
      step request in M2) — interpolateRequest would compile against a stale shape.
    recommended_action: >-
      Export a `ScenarioRequest` type inferred from `ScenarioStepSchema.shape.request`
      (or `z.infer`) in scenarioSchema.ts and import it in interpolate.ts instead of
      the hand-written interface. Keeps the schema the single source of the request
      contract.
  # ---------------------------------------------------------------------------
  # LOW — OCP shape of assert ops + capture/headers coupling note
  # ---------------------------------------------------------------------------
  - id: F-arch-3
    severity: LOW
    file: src/core/evalAssert.ts
    line: 46
    plan_ref: ADR D3 ("novos ops são adições (OCP)")
    summary: >-
      applyOp dispatches the 9 ops via a switch/case; adding an op requires editing
      this function rather than registering an extension — strictly not OCP-closed,
      though acceptable under KISS/YAGNI for a small fixed op set.
    evidence: |
      src/core/evalAssert.ts:46-69 — `function applyOp(op, actual, expected)` switch
      over "equals"|"notEquals"|...|"lte". ADR D3 frames new ops as "adições (OCP)",
      but each addition is a modification of applyOp, not an extension point. For 9
      stable ops this is the simpler design (KISS) and the tension is explicitly
      resolved in CLAUDE.md (SOLID vs YAGNI). Flagged for honesty, not as a defect to
      fix now.
    recommended_action: >-
      No change required at M1. If the op set grows substantially (M2/M3) or becomes
      user-pluggable, refactor to an `ops: Record<string, (a,e)=>boolean>` table so a
      new op is a map entry (true OCP). Document the trade-off if kept as a switch.
  - id: F-arch-4
    severity: LOW
    file: src/core/evalAssert.ts
    line: 28
    plan_ref: EC-1 (header case-insensitive) + Baseline Context "Current callers/dependents"
    summary: >-
      extractActual relies on the implicit invariant that response.headers keys are
      lowercased by the M0 captureHeaders; the dependency is correct but undocumented
      at the consumer, making it a latent coupling.
    evidence: |
      src/core/evalAssert.ts:26-29
      ```ts
      if (source.startsWith("header:")) {
        const name = source.slice("header:".length).toLowerCase();
        return response.headers[name];
      }
      ```
      This is correct: src/core/executeRequest.ts:88 `Object.fromEntries(headers)` on
      a fetch `Headers` yields lowercased keys per the Fetch spec, so the lowercased
      lookup matches (EC-1 honored). But the invariant lives in executeRequest and is
      assumed silently here. If a future code path populates CapturedResponse.headers
      from a non-fetch source without lowercasing, this lookup breaks silently.
    recommended_action: >-
      Add a one-line comment already partly present; consider asserting/normalizing
      the invariant at the CapturedResponseSchema boundary (e.g. a transform that
      lowercases keys) so every consumer can rely on it rather than re-deriving it.
