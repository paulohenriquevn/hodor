roadmap_dod_evidence:
  - dod: "1. Formato declarativo de cenário definido (steps ordenados; step = request + asserts; captura de variáveis para steps seguintes)"
    satisfied: true
    evidence: >
      src/core/scenarioSchema.ts ScenarioSchema = {schemaVersion:1, name, steps[].min(1)};
      ScenarioStepSchema = {name, request, captures?, asserts?}. interpolate.ts propaga
      ${{ var }}. Tasks T1.1+T1.2 (Coverage Matrix gap 1).
  - dod: "2. Engine roda step-a-step, propaga variáveis e avalia asserções (status/headers/body via jsonpath/regex)"
    satisfied: true
    evidence: >
      src/core/runScenario.ts loop sequencial: interpolateRequest -> executeRequest ->
      evalAssert -> evalCapture -> variables = {...variables, ...captures}. evalAssert.ts
      extractActual cobre status/header:<name>/jsonpath:<expr>; evalCapture jsonpath+regex.
      Tasks T1.5/T1.3/T1.4 (gaps 2,3). Provado por run_scenario_propagates_captured_variable.
  - dod: "3. Resultado por step: request/response/headers + pass/fail por assert + valor das variáveis capturadas"
    satisfied: true
    evidence: >
      RunStep estendido com asserts:[{source,op,value,pass,expected,actual}] e
      captures:{[name]:value}. runScenario faz steps.push({...runStep, asserts, captures}).
      render.ts exibe assertsTable (PASS/FAIL + expected/actual) + capturesList.
      Tasks T1.1/T1.5/T3.1 (gap 4). E2E confirma steps[0].captures={id:7}, asserts[].pass.

