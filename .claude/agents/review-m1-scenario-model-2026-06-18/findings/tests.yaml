summary: >
  Suite M1 é sólida: 64/64 testes verdes; pirâmide correta (muitos unit puros de
  interpolate/evalCapture/evalAssert, integração real de runScenario e da tool MCP
  via http.Server efêmero + InMemoryTransport, 1 E2E representativo). AAA limpo,
  nomes descrevem comportamento, zero .skip/.only/comentado. Coverage do core de
  cenário ≥ 90% (statements/lines 96-100%). Edge cases declarados (EC-1 header
  case-insensitive, EC-2 coerção, EC-3 url-encode, Q1 network abort, Q2 var ausente)
  estão exercitados — exceto Q2, que é testado só no nível de unidade `interpolate`,
  nunca via `runScenario` (a fronteira que de fato propaga). Os 3 failure scenarios
  do plano estão verdes. Backward-compat M0 testada (run_step_still_accepts_m0_shape,
  render_run_m0_step_without_asserts_still_renders). Gaps: `loadScenario` (fronteira
  de I/O + validação) sem nenhum teste; invariante CaptureSpec "≥1 de jsonpath/regex"
  sem teste; ramo jsonpath+regex combinado de evalCapture sem teste.

