findings:
  - id: F-tests-1
    severity: MEDIUM
    file: src/core/runScenario.test.ts
    line: 28
    plan_ref: 'Q2 (Unresolved Questions) + T1.5 Deep Dives "interpola url/headers/body de cada step antes de executar"'
    summary: >
      Q2 (variável ausente → ScenarioError, fail-fast) é testada apenas em
      interpolate.test.ts (unit puro). Nenhum teste de runScenario prova que um
      step usando ${{ var }} com a variável NÃO capturada aborta o cenário com
      ScenarioError. A engine é a fronteira onde isso de fato acontece (interpola
      antes de executeRequest) — o comportamento end-to-end de Q2 não é coberto.
    evidence: |
      grep -rn 'ScenarioError|undefined' src/core/runScenario.test.ts -> 0 matches
      (interpolate_throws_on_undefined_variable cobre só a função pura)
      runScenario.ts:29 chama interpolateRequest, que lança ScenarioError;
      nenhum teste exercita esse caminho via runScenario.
    recommended_action: >
      Adicionar test "run_scenario_throws_when_step_references_uncaptured_variable":
      cenário 1-step com url '/x/${{ ausente }}' e captures vazias → runScenario
      rejeita com ScenarioError ANTES de qualquer chamada HTTP.

  - id: F-tests-2
    severity: LOW
    file: src/core/scenarioSchema.test.ts
    line: 66
    plan_ref: 'T1.1 Tasks #3 "loadScenario(path) (read + ScenarioSchema.parse)"'
    summary: >
      loadScenario — a fronteira que lê o cenário do disco e o valida (validação
      na fronteira, architecture.md §2) — não tem nenhum teste. JSON inválido /
      schema inválido / arquivo inexistente não têm prova de comportamento.
    evidence: |
      grep -rn 'loadScenario' src/ -> apenas scenarioSchema.ts:63 (def) e index.ts:29 (export)
      Nenhum .test.ts referencia loadScenario.
    recommended_action: >
      Adicionar 2 testes: "load_scenario_parses_valid_file" (escreve JSON válido
      em tmp, loadScenario retorna Scenario) e "load_scenario_rejects_invalid_schema"
      (JSON com steps:[] → throws ZodError).

  - id: F-tests-3
    severity: LOW
    file: src/core/scenarioSchema.test.ts
    line: 42
    plan_ref: 'T1.1 Deep Dives "CaptureSpecSchema ... (>=1 presente)"'
    summary: >
      O invariante de domínio "capture spec exige jsonpath e/ou regex"
      (CaptureSpecSchema.refine) não é exercitado. Um capture spec vazio `{}`
      deveria ser rejeitado pelo schema, mas nenhum teste prova isso.
    evidence: |
      scenarioSchema.ts:18 .refine(s => s.jsonpath !== undefined || s.regex !== undefined)
      scenarioSchema.test.ts só testa accepts_valid_multistep e rejects_empty_steps.
    recommended_action: >
      Adicionar "scenario_schema_rejects_empty_capture_spec": step com
      captures:{x:{}} → safeParse.success === false.

  - id: F-tests-4
    severity: LOW
    file: src/core/evalCapture.test.ts
    line: 31
    plan_ref: 'T1.3 Deep Dives "jsonpath+regex → aplica regex no resultado do jsonpath"'
    summary: >
      O ramo combinado jsonpath + regex (declarado explicitamente no Deep Dive D2)
      não tem teste. Os 4 testes cobrem jsonpath-só, miss, non-JSON e regex-só,
      mas não a composição (extrair via jsonpath e DEPOIS filtrar via regex).
      Corresponde à branch uncovered evalCapture.ts:25 (branch coverage 84.61%).
    evidence: |
      evalCapture.ts:23 `if (spec.regex !== undefined && value !== null ...)`
      após o bloco jsonpath — nenhum teste fornece {jsonpath, regex} juntos.
    recommended_action: >
      Adicionar "eval_capture_applies_regex_to_jsonpath_result": spec
      {jsonpath:"$.v", regex:"(\\d+)"} sobre '{"v":"build-42"}' → "42".

  - id: F-tests-5
    severity: LOW
    file: src/web/render.test.ts
    line: 86
    plan_ref: 'T3.1 Deep Dives "Invariant: escapa todo valor dinâmico (anti-XSS)"'
    summary: >
      render_run_escapes_assert_values prova escaping de expected/actual na tabela
      de asserts, mas NÃO há teste de escaping do VALOR de uma capture. capturesList
      escapa corretamente (render.ts:81 escapeHtml(String(v))), porém o teste
      render_run_shows_captured_variables usa valor benigno (id:7) — a invariante
      anti-XSS para captures fica não-provada (regressão silenciosa possível).
    evidence: |
      render.ts:81 escapa o valor; render_run_shows_captured_variables usa {id:7}.
      Nenhum teste passa um valor de capture com '<script>' / '<' a renderizar.
    recommended_action: >
      Estender ou adicionar teste: captures:{x:"<script>"} → html NÃO contém
      "<script>" literal e contém "&lt;script&gt;".

  - id: F-tests-6
    severity: LOW
    file: src/core/scenarioSchema.test.ts
    line: 1
    plan_ref: 'rules/testing.md §3 (RED antes de GREEN) + cycle-implement RED→GREEN'
    summary: >
      Para T1.1–T1.5 (commit 213839a) o teste e a implementação foram commitados
      JUNTOS no mesmo commit (scenarioSchema.test.ts + scenarioSchema.ts etc. no
      mesmo diff). A ordem RED-antes-de-GREEN não é verificável pelo histórico git.
      Mesmo padrão do M0 — informativo, não bloqueante (suíte é genuína e verde).
    evidence: |
      git show --stat 213839a -> *.test.ts e *.ts dos 5 módulos no mesmo commit.
    recommended_action: >
      Convenção futura: commitar o RED (teste falhando) separado do GREEN para que
      a disciplina TDD seja auditável no histórico. Não exige ação corretiva no M1.

