close_the_loop_assessment:
  real: true
  agent_can_consume_approval: true
  evidence: >
    check_scenario returns a structured {status, runId, hasRegression} via MCP outputSchema —
    machine-consumable. status is computed against the APPROVED golden (loadVerdict===approved),
    so the agent consumes the human approval rather than producing it. E2E proves the loop closes:
    no_baseline (never approved) -> human approves -> ok -> service changes -> regression detected ->
    replay aggregates -> web shows the diff -> verdicts dir still holds ONLY the golden's verdict.
  no_auth_ceiling_honestly_declared: true
  ceiling_evidence: >
    Declared in plan Context risk #2, ADR D2 Rationale, T6.1 Failure scenarios, Drawbacks table
    (Severidade Alta), and the CHANGELOG entry ('Teto conhecido: re-execução real ainda não injeta
    segredos — endpoints autenticados precisam do M7'). E2E uses an unauthenticated endpoint. Not hidden.

