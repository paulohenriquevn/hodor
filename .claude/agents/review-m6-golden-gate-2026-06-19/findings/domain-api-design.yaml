  - id: F-dom-8
    severity: INFO
    file: src/core/runHistory.ts
    line: 83-96
    plan_ref: "D1 — findGoldenRun = run aprovado mais recente do cenário"
    domain_anchor: "blueprint D1; plan T1.1 acceptance"
    summary: >
      findGoldenRun semantics VERIFIED CORRECT for the adversarial cases raised.
      It sorts ascending by compareRuns (total order createdAt,runId) then iterates
      from newest→oldest returning the first `approved` (filters loadVerdict==="approved",
      not hasVerdict, so rejected runs are excluded). The "newer approved with a
      human-mistaken bug" case is correctly out of code's scope (human-approval error,
      not a gate defect). Orphan-key-on-edit (risk #1) correctly yields null →
      no_baseline. No finding — recorded as positive confirmation.
    evidence: |
      ```ts
      const ofScenario = (await loadAllRuns(dir)).filter((r) => scenarioKey(r) === key).sort(compareRuns);
      for (let i = ofScenario.length - 1; i >= 0; i--) {     // newest → oldest
        const verdict = await loadVerdict(ofScenario[i]!.runId, verdictsDir);
        if (verdict?.verdict === "approved") return ofScenario[i]!;  // first approved = golden
      }
      return null;
      ```
    recommended_action: "None — confirmed correct. Listed for review completeness."
