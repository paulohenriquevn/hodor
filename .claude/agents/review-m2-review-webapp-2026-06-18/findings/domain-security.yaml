summary: |
  SECURITY VERDICT for m2-review-webapp: no BLOCKER, no HIGH.

  The two EC-1 MUST-FIX XSS concerns (human note + external-API-controlled fields) are
  RESOLVED — I enumerated every dynamic ${...} sink in render.ts (renderListing,
  verdictBadge, verdictForm, renderRun, headersTable, bodyBlock, requestSection,
  responseSection, assertsTable, capturesList) and confirmed each attacker-influenceable
  value passes through escapeHtml. Binary bodies are never embedded (ADR D2). Path
  traversal is correctly blocked by RUN_ID_RE on BOTH the GET and the POST surface before
  any path.join, and the verdict file write inherits that UUID-shaped runId. The 1 MB
  readBody cap is enforced on the running total (bounded memory) and leaks no input.

  Residual items are all LOW/INFO and consistent with the documented "local single-user"
  posture:
   - F-sec-1 (LOW): escapeHtml does not escape single-quote; not exploitable today (only
     UUID values reach single-quoted attrs) but the shared escaper should be complete.
   - F-sec-5 (LOW): server.listen() binds 0.0.0.0, not loopback, despite the 127.0.0.1
     log — this undermines the very single-user assumption the CSRF (EC-4) and 500-leak
     accepted-risks rest on. One-line fix (listen on "127.0.0.1") makes the threat model
     real. This is the most worthwhile of the LOWs.
   - F-sec-2 (LOW): 500 handler echoes Error.message (path/schema internals) — acceptable
     locally, must be generic if ever networked.
   - F-sec-3, F-sec-4, F-sec-6 (INFO): positive evidence — traversal defense, DoS cap, and
     XSS escaping all PASS.

  Honest severity call: for the declared local single-user use, none of these block merge.
  But F-sec-1 + F-sec-5 together are cheap, and F-sec-5 is the one I'd push to fix now
  because it silently widens the blast radius beyond the threat model every other accepted
  risk depends on.
