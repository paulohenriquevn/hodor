  - id: F-tests-2
    severity: HIGH
    file: src/web/render.test.ts
    line: 0
    plan_ref: "Failure scenarios table row 4 (risk #2); ADR D2; T1.3 Deep Dives 'binário nunca embutido'"
    summary: >
      The risk-#2 mitigation BEHAVIOR (binary omitted, large text truncated WITH
      notice) is only unit-tested at the pure helper level (pickRenderer/truncate).
      No test asserts the rendered HTML actually omits a binary body or shows the
      truncation notice. A regression in bodyBlock (e.g. embedding a binary body or
      dropping the notice) would pass all current tests.
    evidence: |
      grep "binary omitted|truncado|binário" src/web/render.test.ts -> 0 matches
      render.ts:64-83 bodyBlock builds "(binary omitted — content-type: X)" and the
      truncation "(truncado — exibindo ...)" notice; neither string is asserted.
      render.ts:76 (non-parseable JSON fallback) is reported uncovered.
    recommended_action: >
      Add renderRun-level assertions: (a) a step with content-type image/png renders
      "(binary omitted" and NOT the raw body bytes; (b) a >64KB text body renders the
      "(truncado" notice and a <pre> of length MAX_BODY; (c) a malformed JSON body
      with application/json content-type renders escaped raw (catch fallback).

  - id: F-tests-3
    severity: MEDIUM
    file: src/web/pickRenderer.test.ts
    line: 10
    plan_ref: "T1.3 Deep Dives — 'javascript', 'x-www-form-urlencoded' -> text"
    summary: >
      pickRenderer text-branch is under-tested. The plan explicitly lists javascript,
      x-www-form-urlencoded, +xml, +json as text/json branches, but only text/html
      and application/xml are asserted. The TEXTUAL regex alternatives go unverified.
    evidence: |
      pickRenderer.test.ts asserts: application/json, +json, text/html, application/xml,
      image/png, octet-stream, undefined, APPLICATION/JSON, TEXT/PLAIN.
      Missing: application/javascript, application/x-www-form-urlencoded, image/svg+xml,
      and the "+json" vendor case is covered but "+xml" text-branch is not.
    recommended_action: >
      Add pick_renderer cases for application/javascript -> text,
      application/x-www-form-urlencoded -> text, and a "+xml" content-type -> text.

  - id: F-tests-4
    severity: MEDIUM
    file: src/web/server.ts
    line: 119
    plan_ref: "testing.md §6 — 'Time/randomness in unit tests — inject a clock/RNG'"
    summary: >
      The POST verdict path stamps decidedAt with new Date().toISOString() (wall
      clock), not an injected clock like the rest of the core (buildRunEnvelope takes
      now()). No test asserts decidedAt at all on the POST path, so the only field
      produced non-deterministically by the web layer is both unverified and
      untestable deterministically.
    evidence: |
      server.ts:119  decidedAt: new Date().toISOString()
      grep "decidedAt" src/web/server.test.ts src/review-e2e.test.ts -> 0 matches
      (core verdict.test.ts uses a fixed decidedAt fixture, but the production POST
      caller hard-codes wall-clock time).
    recommended_action: >
      Assert in post_verdict_persists_and_redirects that the persisted verdict has a
      decidedAt that parses as a valid ISO-8601 string (Date.parse not NaN). Longer
      term, thread an injectable clock into postVerdict to match the core's pattern.

