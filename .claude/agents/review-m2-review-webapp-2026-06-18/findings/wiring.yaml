findings:
  - id: F-wire-1
    severity: MEDIUM
    file: src/core/index.ts
    line: 37
    plan_ref: T1.2 — "Exportar em index.ts" / Anti-pattern #5 (dead exports)
    summary: >
      VerdictSchema is re-exported from the core public surface (index.ts:37) but has
      ZERO consumer outside its own module — no production importer, no test importer.
    evidence: |
      grep -rn "VerdictSchema" src/ --include="*.ts":
        src/core/verdict.ts (definition + intra-module .parse calls)
        src/core/index.ts:37 (re-export)
        src/web/server.ts:116 (a COMMENT, not a usage)
      No .test.ts imports VerdictSchema. The web boundary validates indirectly via
      saveVerdict (which calls VerdictSchema.parse internally) — it never references
      the schema export. So the public re-export is dead.
    recommended_action: >
      Either (a) drop VerdictSchema from index.ts (keep saveVerdict/loadVerdict/Verdict
      type — the actual boundary API), or (b) keep it intentionally as planned public
      API and add an ADR note that it's a forward-looking export for M3 versioning.
      Non-blocking; code-quality D3 (cross-package wiring) is the right gate to enforce.

  - id: F-wire-2
    severity: MEDIUM
    file: src/web/render.ts
    line: 30
    plan_ref: rules/cycle-review.md §3 (dead exports) ; Anti-pattern #5
    summary: >
      escapeHtml is exported from render.ts but has no consumer outside render.ts
      (neither production nor test). Pre-existing (M0/M1) but re-confirmed dead in M2.
    evidence: |
      grep -rn "escapeHtml" src/ --include="*.ts" returns only src/web/render.ts lines.
      No external prod importer, no test importer. Used heavily INTRA-module (headersTable,
      bodyBlock, verdictBadge, renderListing, etc.) so it is NOT removable as code — only
      the `export` keyword is unjustified.
    recommended_action: >
      Drop the `export` on escapeHtml (make it module-private) unless a test is intended
      to cover it directly — in which case add the missing escapeHtml unit test (XSS escape
      is security-relevant and currently only covered transitively via render output asserts).

  - id: F-wire-3
    severity: MEDIUM
    file: src/web/render.ts
    line: 43
    plan_ref: T1.3 — "pickRenderer exportado para teste"
    summary: >
      pickRenderer (render.ts:43) and truncate (render.ts:51) are exported solely so the
      unit test can import them; production consumes them intra-module (bodyBlock). This is
      "export-for-test" — acceptable but worth flagging: the export surface is wider than the
      real API needs.
    evidence: |
      pickRenderer: prod caller render.ts:66 (intra-module); only external importer is
        pickRenderer.test.ts (10 asserts). Not in index.ts.
      truncate: prod caller render.ts:70 (intra-module); only external importer is
        pickRenderer.test.ts:30,37. Not in index.ts.
    recommended_action: >
      Acceptable as-is (pure functions, direct unit tests add value per testing.md §4
      edge-cases/validation). No change required; documented so it is not mistaken for a
      cross-package wiring gap. Do NOT promote these to index.ts (they are interface-layer,
      not core — would violate the web→core direction).

